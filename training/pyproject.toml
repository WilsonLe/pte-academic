[project]
name = "pte-pronunciation-comparison"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0",
  "transformers==4.57.1",
  "numpy==2.3.3",
  "scipy==1.16.2",
  "soundfile==0.13.1",
  "cmudict==1.1.1",
  "safetensors==0.6.2",
  "phonemizer==3.3.0",
  "espeakng-loader==0.2.4",
]

[dependency-groups]
export = [
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
]
